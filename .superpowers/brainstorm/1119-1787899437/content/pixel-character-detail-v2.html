<style>

<h2>灰烬先锋 · 人物细节增强稿</h2>
<p class="subtitle">保持手机战斗中的清楚轮廓，同时让角色拥有可识别的服装、面部与装备细节。</p>

<div class="detail-grid">
  <div class="preview-panel">
    <canvas id="detail-preview" width="420" height="330"></canvas>
  </div>
  <div class="feature-list">
    <div class="feature"><b>头部</b><p>灰白短发、单侧面罩、橙色余烬眼，面部不再是单一色块。</p></div>
    <div class="feature"><b>护甲</b><p>墨绿胸甲、黄铜护肩、皮革腰带和分层护腕，维持暗色塔楼气质。</p></div>
    <div class="feature"><b>披风</b><p>破损暗红披风形成左侧大色块，与右手武器构成清晰剪影。</p></div>
    <div class="feature"><b>武器</b><p>不同武器拥有独立握姿与亮色轮廓，战斗中能一眼区分长剑、法杖和弩。</p></div>
    <div class="feature"><b>动画</b><p>待机呼吸、受击闪白、攻击前倾和技能蓄力，不需要复杂骨骼系统。</p></div>
  </div>
</div>

<div class="option" data-choice="detail-v2-approved" onclick="toggleSelect(this)">

</div>

<script>
const cv=document.querySelector('#detail-preview'),c=cv.getContext('2d');c.imageSmoothingEnabled=false;
